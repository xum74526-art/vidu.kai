[project]
name = "vidu-purchase-mcp"
version = "0.8.2"
description = "Conversational Vidu video workflow with account, purchase and generation confirmation."
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastmcp==4.1.0",
  "playwright>=1.55,<2",
  "pydantic>=2.11,<3",
  "httpx>=0.28.1,<1",
  "keyring>=25.7,<26",
  "platformdirs>=4.4,<5",
  "starlette>=1.7,<2",
  "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
vidu-purchase = "vidu_purchase.server:main"
yingban-vidu = "vidu_purchase.desktop:main"
vidu-selfhost = "vidu_purchase.hosted:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vidu_purchase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
