[project]
name = "yingban-vidu-runtime"
version = "0.4.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastmcp==4.1.0",
  "httpx>=0.28.1,<1",
  "pydantic>=2.11,<3",
  "keyring>=25.7,<26",
  "platformdirs>=4.4,<5",
  "playwright>=1.55,<2",
  "starlette>=1.7,<2",
  "uvicorn>=0.54,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidu_purchase"]
